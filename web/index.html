<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>pi-agent 后台</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314171c'/%3E%3Ccircle cx='10' cy='11' r='3.2' fill='%23e8875b'/%3E%3Ccircle cx='22' cy='11' r='3.2' fill='%233ecfa5'/%3E%3Ccircle cx='16' cy='22' r='3.2' fill='%237c8cff'/%3E%3C/svg%3E" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="/style.css" />
</head>
<body>
	<div class="grain" aria-hidden="true"></div>
	<div class="app">
		<aside class="side">
			<header class="brand">
				<div class="brand-mark" aria-hidden="true"><i class="d c"></i><i class="d x"></i><i class="d g"></i></div>
				<div>
					<h1>pi-agent</h1>
					<p class="brand-sub">后台管理</p>
				</div>
			</header>

			<section class="conv-current" aria-label="当前对话">
				<button type="button" class="conv-switch" id="convSwitch" title="切换对话（Ctrl+K）">
					<span class="conv-dot" id="convDot" data-state="idle"></span>
					<span class="conv-main">
						<span class="conv-label">当前对话</span>
						<strong id="convTitle">加载中…</strong>
						<small id="convMeta"></small>
					</span>
					<svg class="conv-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10l4-4 4 4M8 14l4 4 4-4"/></svg>
				</button>
				<div class="conv-actions">
					<button type="button" class="conv-act" id="convAllBtn">全部对话<em id="convCount"></em><kbd>Ctrl K</kbd></button>
					<button type="button" class="conv-act primary" id="sideNewConversationBtn">＋ 新对话</button>
				</div>
			</section>

			<nav class="nav" id="nav" aria-label="页面">
				<p class="nav-group">工作台</p>
				<a href="#/overview" data-view="overview"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/></svg><span>总览</span></a>
				<a href="#/project" data-view="project"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9 5v14M14 9h4M14 13h4"/></svg><span>项目</span><em class="count" data-count="project"></em></a>
				<a href="#/topology" data-view="topology"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M7 11l3-4M7 13l3 4M14 6h7M14 18h4M14 12h6"/></svg><span>协作拓扑</span><em class="count" data-count="topology"></em></a>
				<a href="#/runs" data-view="runs"><svg viewBox="0 0 24 24"><path d="M5 5h14M5 12h14M5 19h9"/><circle cx="19" cy="19" r="1.6"/></svg><span>运行记录</span><em class="count" data-count="runs"></em></a>
				<p class="nav-group">明细</p>
				<a href="#/dispatches" data-view="dispatches"><svg viewBox="0 0 24 24"><path d="M4 12h6l3-6 3 12 2-6h2"/></svg><span>派工明细</span><em class="count" data-count="dispatches"></em></a>
				<a href="#/changes" data-view="changes"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="12" r="2.2"/><path d="M6 8.2v7.6M8 6.8c5 .5 8 2.2 8.4 3.4"/></svg><span>改动</span><em class="count" data-count="changes"></em></a>
				<a href="#/sessions" data-view="sessions"><svg viewBox="0 0 24 24"><path d="M5 6h14v9H9l-4 3z"/></svg><span>CLI 会话</span><em class="count" data-count="sessions"></em></a>
				<a href="#/usage" data-view="usage"><svg viewBox="0 0 24 24"><path d="M5 20V11M10 20V5M15 20v-7M20 20V9"/></svg><span>用量</span></a>
				<p class="nav-group">团队与设置</p>
				<a href="#/agents" data-view="agents"><svg viewBox="0 0 24 24"><circle cx="7" cy="8" r="2.5"/><circle cx="17" cy="8" r="2.5"/><circle cx="12" cy="16" r="2.5"/><path d="M9 9.5l1.6 4.4M15 9.5l-1.6 4.4"/></svg><span>成员</span></a>
				<a href="#/conventions" data-view="conventions"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/></svg><span>Agent 规范</span></a>
				<a href="#/config" data-view="config"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg><span>配置</span></a>
			</nav>

			<div class="side-foot">
				<div class="demo-badge" id="demoBadge" hidden>演示模式</div>
				<div class="side-meta">
					<span class="conn" id="conn" data-state="connecting">连接中</span>
					<button class="icon-btn" id="themeToggle" title="切换明暗主题" aria-label="切换明暗主题">
						<svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8A9 9 0 0 0 12 3Z"/></svg>
					</button>
				</div>
			</div>
		</aside>

		<div class="main">
			<header class="topbar">
				<div class="page-title">
					<h2 id="pageTitle">总览</h2>
					<p id="pageSub"></p>
				</div>
				<div class="topbar-actions">
					<div class="status" id="status" data-state="idle">
						<span class="status-light"></span>
						<span class="status-text" id="statusText">待命</span>
					</div>
					<button type="button" class="stop-btn" id="stopBtn" hidden>
						<svg viewBox="0 0 24 24" width="13" height="13"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
						中止本轮
					</button>
					<button type="button" class="ghost-btn" id="resetBtn" title="只让总调度从新的上下文继续；对话记录和后台数据都保留">重置上下文</button>
				</div>
			</header>
			<main class="content" id="content"></main>
		</div>
	</div>

	<div class="drawer" id="drawer" hidden>
		<div class="drawer-scrim" id="drawerScrim"></div>
		<aside class="drawer-panel" role="dialog" aria-label="派工详情">
			<header class="drawer-head">
				<div class="drawer-title" id="drawerTitle"></div>
				<button type="button" class="icon-btn" id="drawerClose" aria-label="关闭">
					<svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
				</button>
			</header>
			<div class="drawer-body" id="drawerBody"></div>
		</aside>
	</div>

	<dialog id="conversationDialog" class="conversation-dialog" aria-labelledby="conversationDialogTitle">
		<form id="conversationForm">
			<h3 id="conversationDialogTitle">新建独立对话</h3>
			<p id="conversationDialogHint">旧对话及对应的任务、派工、用量和改动完整保留。旧任务继续运行，新对话从空白上下文开始。</p>
			<label for="conversationTitle">对话名称</label>
			<input id="conversationTitle" name="title" maxlength="120" placeholder="例如：前端开发、接口排查" autocomplete="off" />
			<p id="conversationError" class="conversation-error" role="alert" hidden></p>
			<div class="conversation-dialog-actions"><button type="button" class="ghost-btn" id="cancelConversationBtn">取消</button><button type="submit" class="new-conversation-btn" id="saveConversationBtn">创建并切换</button></div>
		</form>
	</dialog>
	<dialog id="convPicker" class="conv-picker" aria-label="切换对话">
		<div class="picker-head">
			<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
			<input type="search" id="convQuery" placeholder="搜索对话：名称、你说过的话、任务标题…" autocomplete="off" aria-label="搜索对话" />
			<button type="button" class="icon-btn" id="convClose" aria-label="关闭"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
		</div>
		<div class="picker-filters" id="convFilters" role="tablist">
			<button type="button" data-f="all" class="on">全部</button>
			<button type="button" data-f="active">有记录</button>
			<button type="button" data-f="running">运行中</button>
			<button type="button" data-f="pending">有待合并</button>
		</div>
		<div class="picker-list" id="convList" role="listbox" aria-label="对话"></div>
		<footer class="picker-foot">
			<span><kbd>↑</kbd><kbd>↓</kbd> 选择　<kbd>Enter</kbd> 切换　<kbd>Esc</kbd> 关闭</span>
			<button type="button" class="new-conversation-btn" id="pickerNewBtn">＋ 新对话</button>
		</footer>
	</dialog>
	<div id="conversationSwitching" class="conversation-switching" role="status" aria-live="polite" hidden>正在切换对话，旧数据已保留…</div>
	<div class="toast" id="toast" role="status" aria-live="polite"></div>
	<script type="module" src="/js/main.js"></script>
</body>
</html>
