<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>pi-agent 调度台</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314171c'/%3E%3Ccircle cx='10' cy='11' r='3.2' fill='%23e8875b'/%3E%3Ccircle cx='22' cy='11' r='3.2' fill='%233ecfa5'/%3E%3Ccircle cx='16' cy='22' r='3.2' fill='%237c8cff'/%3E%3C/svg%3E" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="/style.css" />
</head>
<body>
	<div class="grain" aria-hidden="true"></div>
	<div class="shell">
		<aside class="rail" id="rail">
			<header class="brand reveal">
				<div class="brand-mark" aria-hidden="true"><i class="d c"></i><i class="d x"></i><i class="d g"></i></div>
				<div>
					<h1>pi-agent</h1>
					<p class="brand-sub">本机多 agent 调度台</p>
				</div>
				<button class="icon-btn theme-toggle" id="themeToggle" title="切换明暗主题" aria-label="切换明暗主题">
					<svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8A9 9 0 0 0 12 3Z"/></svg>
				</button>
			</header>

			<section class="rail-block reveal" style="--i: 1">
				<h2 class="eyebrow">总调度</h2>
				<div class="orch-model" id="orchestrator">—</div>
				<div class="kv"><span>工作目录</span><code id="workdir">—</code></div>
				<div class="demo-badge" id="demoBadge" hidden>演示模式 · 不调用真实 API</div>
			</section>

			<section class="rail-block reveal" style="--i: 2">
				<h2 class="eyebrow">团队成员</h2>
				<ul class="roster" id="roster"></ul>
			</section>

			<section class="rail-block reveal" style="--i: 3">
				<h2 class="eyebrow">CLI 会话 <span class="eyebrow-note">点击复制 ID</span></h2>
				<ul class="sessions" id="sessions"><li class="empty">还没有会话</li></ul>
			</section>

			<section class="rail-block reveal" style="--i: 4">
				<h2 class="eyebrow">用量</h2>
				<div id="usage" class="usage"><span class="empty">暂无</span></div>
			</section>
		</aside>

		<main class="main">
			<div class="topbar">
				<button class="icon-btn rail-toggle" id="railToggle" aria-label="显示侧栏">
					<svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
				</button>
				<div class="status" id="status" data-state="idle">
					<span class="status-light"></span>
					<span class="status-text" id="statusText">待命</span>
				</div>
				<div class="topbar-actions">
					<span class="conn" id="conn" data-state="connecting">连接中</span>
					<button class="ghost-btn" id="resetBtn" title="开始新的上下文，历史仍保留在存储里">新上下文</button>
				</div>
			</div>

			<div class="stream" id="stream">
				<div class="timeline" id="timeline"></div>
				<div class="welcome" id="welcome" hidden>
					<p class="welcome-kicker">DISPATCH READY</p>
					<h2>把任务交给总调度</h2>
					<p>它会拆分任务，派给本机的 Claude、Codex、Gemini 并行处理，再核对、汇总结果。所有进度持久保存，进程重启后接着跑。</p>
					<div class="examples" id="examples">
						<button>让 Codex 实现一个函数并跑测试，再让 Claude 审查</button>
						<button>让 Gemini 通读 README，总结这个项目的结构</button>
						<button>Claude 和 Codex 各自给出一个方案，比较后告诉我选哪个</button>
					</div>
				</div>
			</div>

			<form class="composer" id="composer">
				<div class="composer-box">
					<textarea id="input" rows="1" placeholder="描述任务…（Enter 发送）" title="Enter 发送，Shift+Enter 换行" autocomplete="off"></textarea>
					<div class="composer-actions">
						<button type="button" class="stop-btn" id="stopBtn" hidden>
							<svg viewBox="0 0 24 24" width="14" height="14"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
							中止
						</button>
						<button type="submit" class="send-btn" id="sendBtn" aria-label="发送">
							<svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
						</button>
					</div>
				</div>
				<p class="composer-hint" id="hint">运行中发送的消息会排队，在当前这轮结束后处理。</p>
			</form>
		</main>
	</div>
	<div class="toast" id="toast" role="status" aria-live="polite"></div>
	<script type="module" src="/app.js"></script>
</body>
</html>
